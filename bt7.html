  Merged into ormeau-belfast.html on 2026-09-18.

  The four BT postcode pages were the same template with the postcode
  swapped in: about 320 words each, around 190 of them identical across
  all four, and nothing on them that the area pages did not already say.
  Google treats a set like that as doorway pages. Folding each into the
  area it covers (Matt's call, Kathryn's go-ahead) leaves one page per
  place instead of two competing ones.

  BT4 goes to Ballyhackamore, BT7 to Ormeau, BT9 to Stranmillis. BT5 has no
  area page of its own (Castlereagh, Cregagh, Knock), so it goes to the East
  Belfast guide rather than being forced onto a neighbourhood it isn't.

  GitHub Pages cannot send a real 301, so this is the static equivalent:
  a canonical plus an instant meta refresh, which Google treats as a
  permanent redirect. Deliberately no noindex here - that would contradict
  the canonical. Kept rather than deleted so old links, ads and group posts
  still land somewhere.
-->
<link rel="canonical" href="https://clocal.co.uk/ormeau-belfast.html" />
<meta http-equiv="refresh" content="0; url=/ormeau-belfast.html" />
<script>location.replace("/ormeau-belfast.html" + location.search + location.hash);</script>
</head>
