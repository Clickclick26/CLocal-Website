<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>CLocal Open Graph card</title>
  <!--
    Source for assets/social/og-card-2026-11.png, the share image behind every
    og:image / twitter:image on clocal.co.uk. 1200x630 because that is the
    size Facebook, WhatsApp, LinkedIn and X all crop from.

    Rebuilt 21 Nov 2026 to match the app store slides (cream, big navy title,
    real phone screens) and to drop the Belfast wording: CLocal is Northern
    Ireland now, not South and East Belfast. Phone crops in og-phones/ come
    from the v2 store slides (cream background, so they sit on the card with
    no seam). Do not put a place name back on this card.

    Re-render after editing:
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        --headless --disable-gpu --hide-scrollbars \
        --screenshot=assets/social/og-card-2026-11.png --window-size=1200,630 \
        assets/social/og-card.html
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; font-family: "Nunito", system-ui, sans-serif; background: #F7EEE2; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #F7EEE2; }
    .copy { position: absolute; left: 80px; top: 50%; transform: translateY(-50%); width: 600px; }
    .logo { height: 50px; width: auto; display: block; margin-bottom: 30px; }
    h1 { font-weight: 900; font-size: 96px; line-height: 1.02; letter-spacing: -0.035em; color: #1B3A5C; }
    .lead { margin-top: 26px; font-size: 31px; font-weight: 600; line-height: 1.35; color: #5A7373; max-width: 520px; }
    .phone { position: absolute; width: 380px; height: auto; display: block; }
    .p1 { left: 662px; top: 120px; }
    .p2 { left: 812px; top: 60px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <img class="logo" src="../clocal-logo.png" alt="CLocal" />
      <h1>Local,<br />on video</h1>
      <p class="lead">Stories, LocalGems and events from the places on your doorstep.</p>
    </div>
    <img class="phone p1" src="og-phones/watch.png" alt="" />
    <img class="phone p2" src="og-phones/attend.png" alt="" />
  </div>
</body>
</html>
